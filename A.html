<!DOCTYPE html>
<html lang="en">
<head>

        body { font-family: 'Inter', sans-serif; }

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- White container with a subtle shadow -->

        <!-- Clean, modern header -->
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 text-center mb-6 tracking-tight">

        <!-- Map Embed Container -->
        <div class="w-full rounded-xl overflow-hidden border border-gray-200 bg-gray-50 flex items-center justify-center">
            <!-- Exact MarineTraffic Embed Code -->
            <script type="text/javascript">
                width='100%';
                height='500';
                border='0';
                shownames='true';
                zoom='9';
                maptype='0';
                trackvessel='431474000';
            </script>
            <script type="text/javascript" src="https://www.marinetraffic.com/js/embed.js"></script>
        </div>

    </div>

</body>
</html>
