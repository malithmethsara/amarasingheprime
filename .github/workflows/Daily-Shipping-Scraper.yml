name: Daily CBSL Scraper

on:
  schedule:
    - cron: '30 5 * * *'  # 11:00 AM SL Time
    - cron: '0 9 * * *'   # 02:30 PM SL Time
  workflow_dispatch:      # Allows manual testing

permissions:
  contents: write

jobs:
  build:
    # CBSL blocks GitHub-hosted runner IPs (HTTP 403 from AWS ELB),
    # so run on a machine with a Sri Lankan IP.
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: python -m pip install requests beautifulsoup4

      - name: Run scraper script
        shell: bash
        run: python -u Data/Rates/CBSL/daily-CBSL-scraper.py

      - name: Commit and Push changes
        shell: bash
        run: |
          git config user.name "GitHub-Actions-Bot"
          git config user.email "actions@github.com"
          git add Data/Rates/CBSL/CBSL-rates.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Automated update: JPY/LKR selling rate"
          git push
