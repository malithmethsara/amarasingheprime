name: Daily Shipping Schedule Scraper

on:
  schedule:
    # 00:43 UTC = 06:13 AM Sri Lanka Time (Off-peak, avoids queue delays)
    - cron: '43 0 * * *'  
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  scrape-shipping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run shipping scraper
        run: python Data/Shipping/shipping_scraper.py

      - name: Commit and Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/Shipping/shipping_schedule.json
          
          # Check if there are actual updates to commit
          if git diff --staged --quiet; then
            echo "No schedule changes detected today."
          else
            git commit -m "Automated update: Japan to Hambantota shipping schedule [skip ci]"
            git push
          fi
