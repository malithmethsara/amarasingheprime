name: Daily CBSL Scraper

on:
  schedule:
    - cron: '30 5 * * *'  # 11:00 AM SL Time
    - cron: '0 9 * * *'   # 02:30 PM SL Time
  workflow_dispatch:      # Allows manual testing

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest  # Changed from ubuntu-latest to bypass CBSL IP Firewall blocks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 urllib3

      - name: Run scraper script
        run: python Data/Rates/CBSL/daily-CBSL-scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub-Actions-Bot"
          git config --global user.email "actions@github.com"
          
          git add Data/Rates/CBSL/CBSL-rates.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: JPY/LKR selling rate" && git pull --rebase origin main && git push)
